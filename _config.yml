# Site configuration for the Chirpy theme.
# Full reference: https://github.com/cotes2020/chirpy-starter/blob/main/_config.yml
#
# This file is not reloaded by `bundle exec jekyll serve`; restart the server after editing it.

theme: jekyll-theme-chirpy

lang: en

# Leave empty to use the visitor's timezone; or set e.g. America/New_York
timezone:

# --- jekyll-seo-tag settings ---

title: Ivan's Solutions

tagline: Fixes for quirky software, data science, and the occasional loaf of bread

description: >-
  Ivan Grishagin's notes on WSL, Windows, R, Python, Neo4j and other software
  that needed more than one try, plus projects and publications.

url: "https://grishagin.com"

github:
  username: grishagin

# Used by jekyll-github-metadata (Projects page)
repository: grishagin/grishagin.github.io

social:
  name: Ivan Grishagin
  email: grishagin@gmail.com
  links:
    # The first link is the copyright owner's link in the footer
    - https://github.com/grishagin
    - https://scholar.google.com/citations?user=CpJEPnsAAAAJ
    - https://www.researchgate.net/profile/Ivan_Grishagin

webmaster_verifications:
  google:
  bing:

# --- end of jekyll-seo-tag settings ---

analytics:
  goatcounter:
    id:

pageviews:
  provider:

# Empty follows the visitor's system setting, with a light/dark toggle in the sidebar
theme_mode:

cdn:

avatar: /assets/flower.jpg #/assets/bobblehead.png

social_preview_image:

toc: true

actions:
  edit_post:
    enabled: false
    url: ""
    static_url: false

comments:
  provider:

assets:
  self_host:
    enabled:
    env:

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

paginate: 10

baseurl: ""

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      # Post URLs no longer depend on categories, so recategorizing won't break links.
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"
  - Gemfile
  - Gemfile.lock
  - vendor

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
